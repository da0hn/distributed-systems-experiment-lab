# Desenvolvimento local. No homelab o PostgreSQL vem da Camada 6, por
# decisao E-5 de 2026-08-06 — este contêiner existe para reproduzir aquele
# banco na maquina de quem desenvolve, e nunca para ser entregue.
#
# O `wal_level=logical` nao e detalhe de configuracao: a decisao E-18 fez do
# CDC sobre o WAL a fonte do veredito, entao sem ele o oraculo nao tem de
# onde ler. Todas as execucoes pagam o mesmo custo de WAL, e continuam
# comparaveis entre si.
services:

  postgres:
    image: postgres:18-alpine
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=8
      - -c
      - max_wal_senders=8
    environment:
      POSTGRES_DB: lab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # A porta do host e parametrizavel porque uma maquina de trabalho
      # costuma ja ter um PostgreSQL em 5432. Dentro da rede do compose os
      # servicos falam com `postgres:5432`, e nada disso os alcanca.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # A partir da imagem 18 o volume vai em `/var/lib/postgresql`, e nao em
      # `/var/lib/postgresql/data`: os dados passaram a viver num subdiretorio
      # por versao maior, para que `pg_upgrade --link` nao cruze fronteira de
      # ponto de montagem. Montar o caminho antigo faz o contêiner recusar a
      # subir.
      - postgres-data:/var/lib/postgresql
      - ./local/postgres-init.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lab"]
      interval: 5s
      timeout: 5s
      retries: 10

  lab-plane:
    build:
      context: .
      args:
        MODULE: lab-plane
    environment:
      LAB_PLANE_DB_URL: jdbc:postgresql://postgres:5432/lab
      LAB_PLANE_DB_USER: lab_plane
      LAB_PLANE_DB_PASSWORD: lab_plane
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  lab-journal:
    build:
      context: .
      args:
        MODULE: lab-journal
    environment:
      LAB_JOURNAL_DB_URL: jdbc:postgresql://postgres:5432/lab
      LAB_JOURNAL_DB_USER: lab_journal
      LAB_JOURNAL_DB_PASSWORD: lab_journal
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  system-under-test:
    build:
      context: .
      args:
        MODULE: system-under-test
    environment:
      SUT_DB_URL: jdbc:postgresql://postgres:5432/lab
      SUT_DB_USER: sut
      SUT_DB_PASSWORD: sut
      SERVER_PORT: 8082
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    # Sem porta publicada: quem o alcanca e o proxy de borda, que e a unica
    # entrada da stack. Publicar uma segunda entrada aqui daria dois enderecos
    # para a mesma tela, e um deles serviria os estaticos sem `/api` ao lado —
    # a pagina carregaria, e toda chamada de API daria 404.
    depends_on:
      - lab-plane
      - lab-journal

  # A reparticao da API: um pedido sob `/api` chega aqui, e o prefixo seguinte
  # escolhe o servico. E um modulo deste reactor, e nao mais uma regra no proxy
  # de borda, porque a regra especifica e a autenticacao vao morar aqui.
  #
  # Ele NAO serve a interface. O proxy de borda manda `/api` para ca e o resto
  # direto para o nginx do frontend — um estatico nao precisa de autenticacao
  # nem de regra por servico, e passa-lo por aqui so somaria um salto.
  #
  # No cluster ele nao substitui o Traefik, que continua terminando TLS e
  # casando o hostname; a divisao entre API e estatico e do IngressRoute, e a
  # reparticao entre os servicos e daqui.
  #
  # O system-under-test nao tem rota aqui de proposito. Continua com porta
  # publicada acima porque este arquivo e so desenvolvimento local, onde bater
  # nele a mao e diagnostico; no cluster ele nao e exposto.
  api-gateway:
    build:
      context: .
      args:
        MODULE: api-gateway
    environment:
      GATEWAY_LAB_PLANE_URI: http://lab-plane:8080
      GATEWAY_LAB_JOURNAL_URI: http://lab-journal:8081
      SERVER_PORT: 8000
    ports:
      # Porta de diagnostico, e nao a entrada. A entrada e o traefik abaixo,
      # como no cluster; esta existe para separar "o proxy de borda errou" de
      # "o gateway errou" sem ter de ler log dos dois. Ela nao serve a
      # interface: bater na raiz dela devolve 404, porque nao ha catch-all.
      - "${GATEWAY_PORT:-8001}:8000"
    depends_on:
      - lab-plane
      - lab-journal

  # O proxy de borda, e a entrada unica desta stack. No cluster este papel e do
  # Traefik do homelab: ele termina TLS, casa o hostname e divide `/api` do
  # estatico. Aqui ele existe para que o caminho tenha a mesma FORMA — o mesmo
  # numero de saltos ate cada destino, com X-Forwarded-* no meio.
  #
  # Ele serve a interface direto, e manda so `/api` ao gateway. O mapa esta em
  # local/traefik/dynamic.yml.
  #
  # Acesso: http://lab.localhost:8000. Outro hostname bate no 404 do proprio
  # Traefik, e nao chega a servico nenhum.
  traefik:
    image: traefik:v3.3
    ports:
      - "${LAB_PORT:-8000}:80"
    volumes:
      - ./local/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./local/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      - api-gateway
      - frontend

volumes:
  postgres-data:
