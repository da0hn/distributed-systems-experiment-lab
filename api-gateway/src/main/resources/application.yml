# A reparticao da API entre os servicos. Este processo NAO e a entrada da
# stack, e nao serve a interface: quem recebe o navegador e o proxy de borda,
# que manda `/api/...` para ca e o resto para o nginx do frontend.
#
# Frontend e API dividem a mesma origem porque aquele proxy e a unica porta
# publicada — entao nao ha CORS, nao ha preflight, e o SSE dispensa
# withCredentials. Isso nao depende de este processo servir os estaticos.
#
# O que justifica um modulo Spring aqui, e nao mais uma regra de caminho no
# proxy de borda, e o que vem depois: autenticacao e regra especifica por
# servico. Nada disso se aplica a um arquivo estatico.
#
# NENHUM filtro remove prefixo. Cada servico carrega o proprio prefixo em
# `server.servlet.context-path`, entao o caminho publico e o interno sao o
# mesmo. Com StripPrefix, o `Location` de um 201 e o link do stream sairiam
# sem o prefixo, e a falha e silenciosa: nada acusa na subida, o cliente e que
# segue para um caminho que o gateway nao conhece.
#
# O system-under-test NAO tem rota aqui, e a ausencia e deliberada. Ele e o
# sistema medido: uma requisicao a mao durante a janela medida entra no
# oraculo exato como commit real, e nada a distingue da carga do experimento.
spring:
  application:
    name: api-gateway
  cloud:
    # O InetUtils do Spring Cloud tenta descobrir o proprio endereco na subida,
    # e num conteiner que nao resolve o proprio hostname cada tentativa espera
    # o timeout inteiro. Com o default de 1s por chamada e varias chamadas, o
    # processo levava 40s para subir — tempo que vira probe reprovado e rollout
    # lento no cluster. Nada aqui usa service discovery do Spring Cloud, entao
    # o valor descoberto nao serve para nada.
    inetutils:
      timeout-seconds: 1
    # Sem service discovery. As rotas apontam para `http://`, e nunca para
    # `lb://`, entao nenhum DiscoveryClient e consultado — mas ligado ele
    # entrava no health como UNKNOWN, e um componente permanentemente
    # indeterminado num health check treina quem o le a ignora-lo.
    discovery:
      enabled: false
    gateway:
      server:
        webflux:
          # Sem esta regex o gateway nao confia em proxy nenhum, e o efeito e
          # silencioso: ele descarta os X-Forwarded-* que recebe e nao emite os
          # que deveria emitir. O servico de destino recebe a requisicao sem
          # saber quem pediu nem por qual esquema, e nada acusa — o roteamento
          # funciona e o status e 200. Medido nesta stack: o backend via so
          # `X-Real-Ip`, posto pelo Traefik.
          #
          # O default vazio e uma escolha de seguranca do Spring Cloud Gateway:
          # confiar em X-Forwarded-* de qualquer origem deixa qualquer cliente
          # forjar o proprio endereco. A regex cobre as tres faixas privadas da
          # RFC 1918, que e onde vivem tanto a rede do compose quanto a do
          # cluster; nada vindo da internet casa com ela.
          # Em aspas simples, e sem `${...}`. O YAML sem aspas nao processa
          # escape, entao `\\.` viraria barra literal mais ponto e a regex
          # nunca casaria; e um default dentro de `${...}` teria o placeholder
          # fechado pelo primeiro `}` de `{1,3}`. Para sobrescrever, use a
          # variavel SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_TRUSTED_PROXIES.
          trusted-proxies: '10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}'
          routes:
            # A ordem e explicita de proposito. Sem ela a precedencia vem da
            # posicao na lista, e uma rota movida por um motivo sem relacao
            # nenhuma com precedencia mudaria o roteamento em silencio.
            - id: lab-plane
              uri: ${GATEWAY_LAB_PLANE_URI:http://localhost:8080}
              order: 10
              predicates:
                - Path=/api/lab-plane/**

            - id: lab-journal
              uri: ${GATEWAY_LAB_JOURNAL_URI:http://localhost:8081}
              order: 10
              predicates:
                - Path=/api/lab-journal/**

            # Nao ha catch-all, e a ausencia e o desenho. Tudo o que chega aqui
            # veio sob /api, entao um caminho que nao casou com as rotas acima
            # e uma rota de API inexistente, e o 404 deste processo diz isso.
            # Um catch-all para o frontend transformaria esse erro num
            # index.html com 200, e um `fetch` que espera JSON quebraria no
            # parse — longe da causa.

server:
  port: ${SERVER_PORT:8000}
  # Este processo nunca ve o pedido original: um proxy de borda o encaminha, e
  # em producao ha o Cloudflare antes dele. Sem esta linha o Spring monta URL a
  # partir do que enxerga — `http://api-gateway:8000` —, e nao do que o
  # navegador pediu. O primeiro lugar onde isso quebra e o `redirect_uri` de
  # OIDC, que o provedor recusa por nao casar com o registrado.
  #
  # Ela trabalha junto com `trusted-proxies` acima, e nao no lugar dela. Medido
  # nesta stack, com um echo no fim da cadeia:
  #
  #   sem trusted-proxies          o backend recebe so X-Real-Ip
  #   so trusted-proxies           X-Forwarded-Host: lab.localhost,lab.localhost
  #   trusted-proxies + framework  X-Forwarded-Host: lab.ghonda.dev
  #
  # O valor unico e o correto: o transformer aplica os cabecalhos recebidos a
  # requisicao e os consome, e o filtro do gateway os reemite a partir dela ja
  # corrigida — em vez de anexar mais um item a uma lista.
  #
  # Confiar em X-Forwarded-* so e seguro porque `trusted-proxies` restringe a
  # origem as faixas privadas. Publicar este processo direto na internet
  # exigiria rever as duas linhas juntas.
  forward-headers-strategy: framework

management:
  server:
    # Porta propria, fora do caminho que o gateway publica. O Actuator do
    # gateway na porta de trafego seria alcancavel de fora junto com as rotas.
    port: ${MANAGEMENT_PORT:9000}
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
