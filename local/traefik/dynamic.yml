# O mapa de caminhos. Este arquivo e o par local do IngressRoute do cluster, e
# os dois declaram as mesmas tres rotas — divergir entre eles quebra so em
# producao, que e exatamente o defeito que o gateway veio remover.
#
# NENHUM middleware remove prefixo. Cada servico carrega o proprio prefixo em
# `server.servlet.context-path`, entao o caminho publico e o interno sao o
# mesmo. Com StripPrefix, o `Location` de um 201 e o link do stream sairiam
# sem o prefixo, e a falha e silenciosa: nada acusa na subida, o cliente e que
# segue para um caminho que o gateway nao conhece.
#
# O system-under-test NAO aparece aqui, e a ausencia e deliberada. Ele e o
# sistema medido: uma requisicao a mao durante a janela medida entra no
# oraculo exato como commit real, e nada a distingue da carga do experimento.
http:
  routers:

    lab-plane:
      rule: "PathPrefix(`/api/lab-plane`)"
      # A prioridade e explicita de proposito. O Traefik ordena por
      # comprimento da regra quando ela e omitida, e os prefixos de API ja
      # ganhariam do catch-all por serem mais longos — mas depender disso faz
      # o roteamento mudar de comportamento quando alguem edita uma regra por
      # um motivo sem relacao nenhuma com precedencia.
      priority: 100
      entryPoints:
        - web
      service: lab-plane

    lab-journal:
      rule: "PathPrefix(`/api/lab-journal`)"
      priority: 100
      entryPoints:
        - web
      service: lab-journal

    frontend:
      rule: "PathPrefix(`/`)"
      priority: 1
      entryPoints:
        - web
      service: frontend

  services:

    lab-plane:
      loadBalancer:
        servers:
          - url: "http://lab-plane:8080"

    lab-journal:
      loadBalancer:
        servers:
          - url: "http://lab-journal:8081"
        responseForwarding:
          # A timeline chega por Server-Sent Events. O intervalo de flush
          # decide de quanto em quanto tempo o Traefik empurra o que ja tem
          # para o cliente; no valor default um evento fica retido ate o
          # proximo tick, e "ao vivo" vira "em lote" sem erro nenhum aparecer.
          flushInterval: "1ms"

    frontend:
      loadBalancer:
        servers:
          - url: "http://frontend:80"
