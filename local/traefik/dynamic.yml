# O mapa de rotas do proxy de borda local. Ele e o par do IngressRoute do
# cluster, e tem a mesma forma: um hostname, e DUAS regras sob ele.
#
#   /api/...  -> api-gateway, que reparte por prefixo entre os servicos
#   o resto   -> frontend, servido direto pelo nginx
#
# O gateway nao serve mais a interface. Ele existe para repartir a API entre
# os servicos e para receber autenticacao e regra especifica; um arquivo
# estatico nao precisa de nada disso, e atravessa-lo so acrescentava um salto
# de WebFlux ao carregamento da pagina.
#
# A origem continua uma so: os dois caminhos entram por `lab.localhost:8000`,
# entao o navegador nao ve cross-origin, nao ha preflight, e o SSE dispensa
# `withCredentials`. Quem garante isso e este proxy ser a unica porta
# publicada — e nao qual processo atende cada prefixo.
#
# `lab.localhost` resolve para 127.0.0.1 sem entrada no arquivo hosts: o
# sufixo `.localhost` e reservado pela RFC 6761, e os resolvedores o tratam
# como loopback. Verificado no Windows.
#
# Um pedido com outro Host cai no 404 do proprio Traefik, e nao chega a
# servico nenhum — que e o comportamento do cluster, onde um hostname sem
# IngressRoute nao alcanca workload nenhum.
http:
  routers:

    # A prioridade e explicita de proposito. Sem ela o Traefik ordena pelo
    # COMPRIMENTO da regra, e esta ganharia por ser mais longa — mas por
    # acidente: renomear o prefixo para algo mais curto que a regra do
    # frontend inverteria a precedencia, e a API passaria a devolver o
    # index.html com 200. Numero maior vence.
    api:
      rule: "Host(`lab.localhost`) && PathPrefix(`/api`)"
      priority: 100
      entryPoints:
        - web
      service: api-gateway

    frontend:
      rule: "Host(`lab.localhost`)"
      priority: 10
      entryPoints:
        - web
      service: frontend

  services:

    api-gateway:
      loadBalancer:
        servers:
          - url: "http://api-gateway:8000"
        responseForwarding:
          # A timeline chega por Server-Sent Events, e o stream atravessa este
          # proxy. O intervalo de flush decide de quanto em quanto tempo o
          # Traefik empurra o que ja tem; no valor default um evento fica
          # retido ate o proximo tick, e "ao vivo" vira "em lote" sem erro
          # nenhum aparecer.
          flushInterval: "1ms"

    frontend:
      loadBalancer:
        servers:
          - url: "http://frontend:80"
