# Build, provas e imagem. Decisão `E-4`, em `docs/fila-de-decisoes.md`.
#
# **Nenhum experimento roda aqui.** O E1 do MVP é obrigado a violar a
# invariante — esse é o resultado que ele existe para produzir — e um
# experimento cujo resultado esperado é a violação inverteria o significado
# de verde. O experimento é acionado pela pessoa, no frontend.
#
# **Este repositório não tem `deploy/`, e isso é decisão e não lacuna.** Os
# manifests do laboratório vivem no `homelab-infrastructure`, junto dos
# Secrets, e quem os aponta para a imagem nova é o ArgoCD Image Updater, que
# observa o GHCR. Nenhum commit de bump sai daqui, e por isso nenhuma
# credencial de escrita em outro repositório existe neste. É `E-3`, fechada
# em 2026-08-13.
name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Dois pushes seguidos na `master` publicariam duas versões em paralelo, e a
# ordem de chegada ao GHCR deixaria de ser a ordem dos commits. Na `master` a
# execução anterior termina; num Pull Request ela é cancelada, porque ali o
# que importa é o veredito do último push.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: '25'
  NODE_VERSION: '24'

jobs:

  mudancas:
    name: Módulos alterados
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      modulos: ${{ steps.detectar.outputs.modulos }}
    steps:
      # O diff precisa do histórico, e o checkout raso não o tem.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # A versão é lida de onde ela vive, e não declarada aqui: os três
      # executáveis Java herdam a do reactor, e o frontend tem a própria no
      # `package.json`. Um número copiado para este arquivo seria um segundo
      # lugar de verdade, e os dois divergiriam na primeira release.
      #
      # `shared` não vira imagem — é biblioteca dos outros três, e por isso
      # aparece só como gatilho de reconstrução, nunca como item da matriz.
      - name: Detectar o que mudou
        id: detectar
        run: |
          set -euo pipefail

          case "${{ github.event_name }}" in
            pull_request) base='${{ github.event.pull_request.base.sha }}' ;;
            push)         base='${{ github.event.before }}' ;;
            *)            base='' ;;
          esac

          # Primeiro push de uma branch, force-push e `workflow_dispatch` não
          # têm base utilizável. Nesses casos constrói tudo: um diff contra
          # uma base inexistente devolveria a lista vazia, e o silêncio seria
          # lido como "nada mudou".
          if [ -z "$base" ] \
            || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "Sem base de comparação utilizável: constrói tudo."
            alterados='TODOS'
          else
            alterados="$(git diff --name-only "$base" '${{ github.sha }}')"
            echo "Base: $base"
            echo "$alterados"
          fi

          # Uma mudança em `shared/`, no reactor, no `Dockerfile` ou neste
          # workflow alcança os três executáveis Java: os três compilam a
          # partir dos mesmos arquivos.
          comum='^(pom\.xml|Dockerfile|shared/|\.github/workflows/build\.yml)'

          afeta() {
            [ "$alterados" = 'TODOS' ] && return 0
            printf '%s\n' "$alterados" | grep -qE "$1"
          }

          # A descrição distingue os artefatos para quem abre o pacote no GHCR
          # sem conhecer este repositório — e a distinção que ela carrega é a
          # mais importante daqui: qual imagem é o instrumento e qual é o
          # sistema medido. Confundir os dois invalida qualquer conclusão.
          descrever() {
            case "$1" in
              lab-plane)         echo 'Lab Plane: o instrumento que mede' ;;
              lab-journal)       echo 'Lab Plane: o caderno de laboratório' ;;
              system-under-test) echo 'System under test: o sistema medido' ;;
              frontend)          echo 'Interface web do laboratório' ;;
            esac
          }

          itens=''
          juntar() {
            [ -n "$itens" ] && itens="${itens},"
            itens="${itens}{\"modulo\":\"$1\",\"contexto\":\"$2\",\"versao\":\"$3\""
            itens="${itens},\"base\":\"$4\",\"descricao\":\"$(descrever "$1")\"}"
          }

          # A base do runtime, para o label `base.digest`. `revision` diz qual
          # CÓDIGO entrou na imagem; ele não diz qual JRE entrou. As duas tags
          # abaixo são móveis: dois builds do mesmo commit, em semanas
          # diferentes, rodam sobre bases distintas. Numa plataforma cujo
          # propósito é comparar execuções separadas no tempo, essa é
          # exatamente a variável que não pode ficar sem registro.
          base_jvm="eclipse-temurin:${JAVA_VERSION}-jre-alpine"
          base_web='nginx:1.29-alpine'

          # `<version>` do próprio projeto é o primeiro depois de `</parent>`;
          # o anterior é a versão do Spring Boot. O sufixo `-SNAPSHOT` sai,
          # porque tag OCI nomeia artefato publicado e não candidato local.
          versao_jvm="$(
            sed -n '/<\/parent>/,$p' pom.xml \
              | grep -m1 -oP '(?<=<version>)[^<]+'
          )"
          versao_jvm="${versao_jvm%-SNAPSHOT}"

          versao_web="$(
            grep -m1 -oP '(?<="version": ")[^"]+' frontend/package.json
          )"

          for modulo in lab-plane lab-journal system-under-test; do
            if afeta "${comum}|^${modulo}/"; then
              juntar "$modulo" '.' "$versao_jvm" "$base_jvm"
            fi
          done

          if afeta '^(frontend/|\.github/workflows/build\.yml)'; then
            juntar 'frontend' './frontend' "$versao_web" "$base_web"
          fi

          echo "modulos=[${itens}]" >> "$GITHUB_OUTPUT"
          echo "Matriz: [${itens}]"

  provas:
    name: Build, testes e guardas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Os testes de contexto sobem um PostgreSQL real por Testcontainers. O
      # runner hospedado já traz Docker; sem ele, a prova de equivalência de
      # traço de SQL que o ADR-0001 exige não teria onde rodar.
      #
      # O reactor inteiro roda mesmo quando um só módulo muda, e isso é
      # deliberado: `shared` é dependência dos três, e provar só o módulo
      # tocado deixaria passar a quebra que ele causa nos outros dois.
      - name: Verificar o reactor Maven
        run: mvn -B verify

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verificar o frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  imagem:
    name: Publicar no GHCR
    needs: [mudancas, provas]
    # A lista vazia acontece quando o commit tocou só documentação, e aí não
    # há imagem a publicar. Antes desta condição, todo commit de `docs/`
    # publicava quatro tags novas de conteúdo idêntico.
    if: >
      github.ref == 'refs/heads/master'
      && needs.mudancas.outputs.modulos != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        incluir: ${{ fromJSON(needs.mudancas.outputs.modulos) }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Credencial efêmera do próprio job, por exigência da ADR 0017 do
      # `homelab-infrastructure`. Nenhum Secret de longa duração vive aqui.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A tag é `X.Y.Z-<build>`, e nunca `latest`. O que a regra protege é
      # poder dizer qual imagem produziu um resultado de experimento, e uma
      # tag imutável basta para isso — `github.run_number` cresce a cada
      # execução e nunca se repete. O commit exato fica em
      # `org.opencontainers.image.revision`, e é por ele que se volta do
      # artefato ao código.
      #
      # O número pula por imagem: se um commit toca só `lab-plane`, ele sobe
      # para `-42` enquanto `lab-journal` fica em `-37`. É o comportamento
      # desejado. Nada exige que as quatro imagens existam na mesma versão,
      # porque nenhum manifesto as referencia por um identificador comum — o
      # Image Updater resolve cada imagem pela tag mais recente dela.
      # A data vem do COMMIT, e não do relógio do runner. Um `created` com a
      # hora do build faz duas construções da mesma árvore produzirem digests
      # diferentes, e a propriedade que este repositório existe para ter é
      # justamente poder dizer qual imagem produziu qual resultado.
      # `SOURCE_DATE_EPOCH` é lido pelo BuildKit, que normaliza os timestamps
      # das camadas a partir dele.
      #
      # O digest da base é resolvido AGORA, e registrado como metadado. As
      # tags de base são móveis; o digest não é.
      - name: Resolver a data do commit e o digest da base
        id: proveniencia
        run: |
          set -euo pipefail
          epoch="$(git log -1 --pretty=%ct)"
          {
            echo "epoch=${epoch}"
            echo "criado=$(date -u -d "@${epoch}" +%Y-%m-%dT%H:%M:%SZ)"
            echo "base_digest=$(
              docker buildx imagetools inspect '${{ matrix.incluir.base }}' \
                --format '{{.Manifest.Digest}}'
            )"
          } >> "$GITHUB_OUTPUT"

      - name: Construir e publicar
        uses: docker/build-push-action@v6
        env:
          SOURCE_DATE_EPOCH: ${{ steps.proveniencia.outputs.epoch }}
        with:
          context: ${{ matrix.incluir.contexto }}
          # `JAVA_VERSION` é passado para o `Dockerfile` amarrar a base que o
          # label declara. Sem isso, o `ARG` do `Dockerfile` e o `env` deste
          # workflow são dois números independentes, e o label mentiria na
          # primeira vez que um deles mudasse sozinho. O `Dockerfile` do
          # frontend não declara esse `ARG` e simplesmente o ignora.
          build-args: |
            MODULE=${{ matrix.incluir.modulo }}
            JAVA_VERSION=${{ env.JAVA_VERSION }}
          push: true
          tags: >
            ghcr.io/${{ github.repository }}/${{ matrix.incluir.modulo }}:${{ matrix.incluir.versao }}-${{ github.run_number }}
          labels: |
            org.opencontainers.image.title=${{ matrix.incluir.modulo }}
            org.opencontainers.image.description=${{ matrix.incluir.descricao }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ matrix.incluir.versao }}-${{ github.run_number }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ steps.proveniencia.outputs.criado }}
            org.opencontainers.image.base.name=${{ matrix.incluir.base }}
            org.opencontainers.image.base.digest=${{ steps.proveniencia.outputs.base_digest }}
          cache-from: type=gha,scope=${{ matrix.incluir.modulo }}
          cache-to: type=gha,mode=max,scope=${{ matrix.incluir.modulo }}

  # O único check obrigatório é este, e o motivo está na ADR 0017 do homelab:
  # um check que depende de matriz filtrada NUNCA reporta status quando a
  # matriz sai vazia, e o Pull Request trava para sempre esperando por ele.
  # `if: always()` faz este job rodar mesmo assim, e o `result` de cada
  # dependência é conferido à mão — `needs` sozinho pularia o job.
  porta:
    name: Porta do build
    needs: [mudancas, provas, imagem]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir o veredito de cada job
        run: |
          set -euo pipefail
          echo "mudancas: ${{ needs.mudancas.result }}"
          echo "provas:   ${{ needs.provas.result }}"
          echo "imagem:   ${{ needs.imagem.result }}"

          # `skipped` é resultado legítimo para `imagem`: Pull Request não
          # publica, e commit sem módulo alterado não tem o que publicar.
          for r in '${{ needs.mudancas.result }}' '${{ needs.provas.result }}'; do
            [ "$r" = 'success' ] || { echo 'Prova obrigatória falhou.'; exit 1; }
          done

          case '${{ needs.imagem.result }}' in
            success|skipped) ;;
            *) echo 'A publicação da imagem falhou.'; exit 1 ;;
          esac
