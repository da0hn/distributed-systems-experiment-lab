# Verificação da documentação. Decisão `C-5`, em
# `docs/adr/arquivo/proposta-2026-08-03/decisoes-pendentes.md`.
#
# Este workflow NÃO constrói, NÃO empacota e NÃO entrega nada. Ele verifica os
# documentos, e só isso. Desde 2026-08-06 o build e o empacotamento existem, e
# vivem em `build.yml` — os dois são separados de propósito: um defeito de
# citação não deve impedir a publicação da imagem, nem o contrário.
name: docs

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: Citações e limites de caracteres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # Alvo inexistente, linha citada além do fim do alvo, e âncora que não
      # corresponde a título nenhum. A baseline carrega os defeitos conhecidos,
      # cada um com a decisão que o autorizou.
      - name: Verificar as citações
        run: >
          python scripts/check_citations.py
          --root .
          --baseline scripts/citations-baseline.txt

      # O glob alcança TODO `.md` sob `docs/`, e não mais só os ADRs numerados.
      # A pessoa decidiu em 2026-08-12, no fecho do orçamento de prosa: o teto
      # passou a ser propriedade da CLASSE de artefato, e a medição passou a
      # alcançar a pasta inteira. Antes disso, tudo com teto próprio fora de
      # `docs/adr/` — os Feature Card, `integrations.md` — era medido em edição
      # e por ninguém no CI.
      #
      # **Alargar o glob não reprova ninguém por consequência automática**, e
      # essa foi a condição da escolha. Quem já excedia quando o alcance mudou
      # está em `TRIAGE_PENDING`, dentro do script, e é reportado como `TRIAGEM`
      # sem reprovar até a classe dele ser decidida. Cada entrada de lá some
      # quando a decisão for escrita, e a lista vazia é o estado final.
      #
      # `.claude/**` continua fora, de propósito e com custo nomeado: a pessoa
      # escolheu `docs/` contra "todo Markdown versionado". Instrução de skill é
      # classe isenta de qualquer forma, mas nada a mede.
      - name: Verificar os limites de caracteres sob docs/
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r f; do
            args+=(--file "$f")
          done < <(find docs -type f -name '*.md' | sort)
          python .claude/skills/feature-planning/scripts/check_artifact_limits.py \
            --root . "${args[@]}"

      # Recusa identificador repetido na fila. Nasceu do fecho de `E-73`, em
      # 2026-08-12: `E-62` e `E-63` nomearam duas linhas cada um, os pares
      # nasceram no mesmo dia em worktrees paralelas, e a mesclagem juntou os
      # quatro sem que nada acusasse. A colisão é silenciosa porque o slug GFM
      # carrega o título inteiro, e não só o identificador — as duas âncoras
      # resolvem, e o `check_citations.py` passa nas duas. O que quebra é a
      # citação por identificador em prosa, que é como o `AGENTS.md` e os ADRs
      # citam a fila.
      - name: Verificar a unicidade dos identificadores da fila
        run: >
          python scripts/check_queue_ids.py
          --root .

      # Compara o nome de tabela de cada `erDiagram` de
      # `docs/architecture/schemas/` com as migrações Flyway do serviço
      # correspondente. A baseline carrega a divergência deliberada, e uma
      # entrada dela que deixe de casar com algo reprova — uma linha que
      # autoriza uma divergência já resolvida esconderia a próxima.
      - name: Verificar a sincronia entre diagrama e migração
        run: >
          python scripts/check_schema_sync.py
          --root .
          --baseline scripts/schema-sync-baseline.txt
