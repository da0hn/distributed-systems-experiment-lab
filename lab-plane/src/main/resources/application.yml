# O Lab Plane e o instrumento. Ele nao compartilha schema com nenhum outro
# servico: a decisao E-5 de 2026-08-06 fixou um schema por servico, e E-18
# fixou que a leitura do estado medido vem do CDC sobre o WAL, e nunca de um
# SELECT no schema alheio.
spring:
  application:
    name: lab-plane
  datasource:
    url: ${LAB_PLANE_DB_URL:jdbc:postgresql://localhost:5432/lab}
    username: ${LAB_PLANE_DB_USER:lab_plane}
    password: ${LAB_PLANE_DB_PASSWORD:lab_plane}
  flyway:
    # A V1 cria so o schema: sem NENHUMA migracao o Flyway nao roda, e a
    # fronteira de E-18 ficaria em configuracao e ausente no banco. As
    # tabelas dependem das decisoes E-8 a E-13, do grupo II do Lote E.
    schemas: lab_plane
    default-schema: lab_plane
    create-schemas: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
