# O Lab Plane e o instrumento. Ele nao compartilha schema com nenhum outro
# servico: a decisao E-5 de 2026-08-06 fixou um schema por servico, e E-18
# fixou que a leitura do estado medido vem do CDC sobre o WAL, e nunca de um
# SELECT no schema alheio.
spring:
  application:
    name: lab-plane
  datasource:
    url: ${LAB_PLANE_DB_URL:jdbc:postgresql://localhost:5432/lab}
    username: ${LAB_PLANE_DB_USER:lab_plane}
    password: ${LAB_PLANE_DB_PASSWORD:lab_plane}
  flyway:
    # A V1 cria so o schema: sem nenhuma migracao o Flyway nao roda, e a
    # fronteira de E-18 fica ausente no banco. A forma da tabela de
    # execucoes ativas segue sem nome (esquemas.md; decisoes E-35, E-50).
    schemas: lab_plane
    default-schema: lab_plane
    create-schemas: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    # O gateway nao remove o prefixo, entao o caminho publico e o interno sao
    # o mesmo e o servico nao precisa saber que existe um gateway na frente.
    # Se o gateway removesse `/api/lab-plane`, toda URL absoluta gerada aqui
    # — o `Location` de um 201, o link do stream — sairia sem o prefixo, e o
    # cliente seguiria para um caminho inexistente sem nenhum erro na subida.
    #
    # O `/api` faz parte do prefixo: frontend e API dividem a mesma origem,
    # e e o `/api` que separa a chamada de servico do arquivo estatico.
    context-path: ${SERVER_CONTEXT_PATH:/api/lab-plane}
  # Dois proxies ficam entre o navegador e este processo, e nenhum deles
  # preserva o esquema nem o host do pedido original. Sem esta linha, uma URL
  # absoluta gerada aqui sai com `http://lab-plane:8080`, que nao existe para
  # o cliente. So e seguro porque nada alcanca esta porta sem passar pelo
  # gateway.
  forward-headers-strategy: framework

management:
  server:
    # Porta propria, e nao um caminho dentro da porta do servico. Sob o
    # context-path o Actuator cairia em `/api/lab-plane/actuator/**`, dentro
    # do PathPrefix que o gateway publica — e `show-details: always` entrega
    # o estado da conexao de banco a quem alcancar a URL. Numa porta que o
    # gateway nao roteia, o probe continua funcionando de dentro e nada disso
    # atravessa a fronteira.
    port: ${MANAGEMENT_PORT:9080}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
