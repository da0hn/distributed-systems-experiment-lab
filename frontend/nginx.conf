# Este servidor serve os estaticos, e nada mais. O roteamento de API saiu
# daqui em 2026-08-15: quem escolhe o servico pelo prefixo do caminho e o
# modulo api-gateway.
#
# O motivo de tirar o proxy nao foi arrumacao. O mapa de caminhos existia em
# tres lugares — o proxy do Vite, este arquivo e o recurso de exposicao do
# cluster —, escritos em tres sintaxes, e um deles divergir dos outros so
# aparece em producao. Manter o proxy aqui tambem poria o pod do frontend no
# caminho de toda chamada de API, o que faz de uma pagina estatica um ponto
# de falha para o instrumento.
#
# O SSE nao precisa mais de tratamento nesta camada: o stream nao passa por
# aqui. O gateway e reativo, e nao bufferiza o corpo da resposta.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Recusa, e nao roteamento: `/api` pertence aos servicos, e o que chega
  # aqui sob esse prefixo e um caminho que o gateway nao reconheceu. Sem esta
  # linha o catch-all abaixo serviria o index.html com 200, e um `fetch` que
  # espera JSON quebraria no parse — um erro que aponta para o cliente quando
  # a causa e uma rota errada no gateway.
  location /api {
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
