# O frontend fala com dois servicos, por E-20: comando no lab-plane, leitura
# e streaming no lab-journal. Nao ha BFF, entao o roteamento vive aqui e, no
# cluster, no recurso de exposicao.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/runs {
    proxy_pass http://lab-plane:8080;
    proxy_set_header Host $host;
  }

  location /api/journal {
    proxy_pass http://lab-journal:8081;
    proxy_set_header Host $host;

    # O streaming da timeline e SSE. Sem estas tres linhas o nginx acumula a
    # resposta num buffer e o evento so chega quando o buffer enche — o que
    # transforma "ao vivo" em "em lote" sem nenhum erro aparecer.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }
}
