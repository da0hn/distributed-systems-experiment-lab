# Este servidor serve os estaticos, e nada mais. O roteamento de API saiu
# daqui em 2026-08-15: o proxy de borda manda `/api` ao api-gateway, que
# escolhe o servico pelo prefixo seguinte, e manda o resto para ca.
#
# O motivo de tirar o proxy nao foi arrumacao. O mapa de caminhos existia em
# tres lugares — o proxy do Vite, este arquivo e o recurso de exposicao do
# cluster —, escritos em tres sintaxes, e um deles divergir dos outros so
# aparece em producao. Manter o proxy aqui tambem poria o pod do frontend no
# caminho de toda chamada de API, o que faz de uma pagina estatica um ponto
# de falha para o instrumento.
#
# O SSE nao precisa de tratamento nesta camada: o stream nao passa por aqui.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Recusa, e nao roteamento. Em operacao normal nada sob `/api` chega aqui —
  # o proxy de borda desvia esse prefixo antes. Esta linha guarda contra a
  # regressao daquela regra: sem ela o catch-all abaixo serviria o index.html
  # com 200, e um `fetch` que espera JSON quebraria no parse, apontando para o
  # cliente quando a causa e o mapa do proxy.
  location /api {
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
