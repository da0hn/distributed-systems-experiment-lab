# O sistema medido. Ele nao sabe que esta sendo medido, e nao conhece
# nenhum outro servico deste repositorio.
#
# O pool tem uma conexao por worker, por regra estrutural: se o pool
# serializar dois workers, todo experimento do grupo A produz um falso
# negativo silencioso. O tamanho fica alto o bastante para nao ser o gargalo,
# e a verificacao efetiva e a decisao D-DAT-09, ainda aberta.
spring:
  application:
    name: system-under-test
  datasource:
    url: ${SUT_DB_URL:jdbc:postgresql://localhost:5432/lab}
    username: ${SUT_DB_USER:sut}
    password: ${SUT_DB_PASSWORD:sut}
    hikari:
      maximum-pool-size: ${SUT_DB_POOL_SIZE:32}
  flyway:
    # A V1 cria so o schema; a forma de resource e allocation (dono unico:
    # esquemas.md, ADR-0015) ainda nao tem migracao V2. A coluna version
    # continua proibida ate o commit que introduzir OPTIMISTIC (ADR-0006).
    schemas: sut
    default-schema: sut
    create-schemas: true

# Nao ha `servlet.context-path` aqui, e a ausencia e deliberada. O prefixo
# existe nos outros dois porque eles ficam atras do gateway; este nao fica.
# Expo-lo convidaria uma requisicao a mao durante a janela medida, que entra
# no oraculo exato como commit real e nao se distingue da carga do
# experimento — o veredito sairia errado sem nenhum erro aparecer. Ele e
# alcancado so de dentro, pelo nome do servico.
server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
